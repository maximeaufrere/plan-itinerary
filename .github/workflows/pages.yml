name: Publier l'app web

# Publie le dossier web/ sur GitHub Pages à chaque modification de l'app web sur la branche par défaut.
on:
  push:
    branches: [claude/ios-route-planner]
    paths: ['web/**', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        working-directory: web
        run: npm test

      - uses: actions/configure-pages@v5

      # Numéro de version dans les adresses des fichiers : après chaque publication, les navigateurs
      # (Safari notamment) rechargent tout ensemble au lieu de mélanger ancien et nouveau code.
      - name: Versionner les fichiers
        run: |
          cp -r web _site
          bash scripts/version-assets.sh _site "${GITHUB_SHA::8}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
