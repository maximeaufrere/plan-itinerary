name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project PlanItinerary.xcodeproj \
            -scheme PlanItinerary \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS-26' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project PlanItinerary.xcodeproj \
            -scheme PlanItinerary \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
